name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov
    
    - name: Configure CMake
      run: cmake -S . -B _build -DBUILD_TESTS=ON -DCOLLECT_COVERAGE=ON
      
    - name: Build
      run: cmake --build _build
      
    - name: Run tests
      run: |
        cd _build
        ctest --verbose --output-on-failure
        
    - name: Generate coverage report
      run: |
        cd _build
        # Запустить тесты еще раз для уверенности
        ctest --verbose > /dev/null 2>&1 || true
        # Проверить, есть ли .gcda файлы
        find . -name "*.gcda" -type f
        # Собрать покрытие с игнорированием ошибок
        lcov --capture --directory . --output-file coverage.info --ignore-errors empty,unused
        lcov --remove coverage.info '/usr/*' '*/third-party/*' '*/tests/*' --output-file coverage.info --ignore-errors unused
        lcov --list coverage.info
        
    - name: Upload to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: _build/coverage.info